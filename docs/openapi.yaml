openapi: 3.1.0
info:
  title: Marvel Heroes Catalog API
  version: 1.0.0
  description: Public catalog and first-party session identity interface for the Marvel Heroes application.
servers:
  - url: /api/v1
paths:
  /sanctum/csrf-cookie:
    servers: [{ url: / }]
    get:
      summary: Initialize first-party CSRF and session cookies
      responses:
        '204': { description: XSRF-TOKEN and session cookies initialized. }
        '503': { $ref: '#/components/responses/IdentityUnavailableProblem' }
  /auth/register:
    post:
      summary: Register an identity and establish a session
      description: First-party session flow. Bootstrap /sanctum/csrf-cookie first and send X-XSRF-TOKEN. No Bearer token is issued. Passwords are never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Registration' }
      responses:
        '201':
          description: Identity created and session regenerated.
          content: { application/json: { schema: { $ref: '#/components/schemas/IdentityResource' } } }
        '419': { $ref: '#/components/responses/CsrfProblem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
        '429': { $ref: '#/components/responses/RateLimitProblem' }
        '503': { $ref: '#/components/responses/IdentityUnavailableProblem' }
  /auth/login:
    post:
      summary: Establish a first-party session
      description: Bootstrap /sanctum/csrf-cookie first. Invalid credentials use the same validation response whether the email exists or not. No persistent browser token is issued.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Login' }
      responses:
        '200':
          description: Authenticated identity and regenerated session.
          content: { application/json: { schema: { $ref: '#/components/schemas/IdentityResource' } } }
        '419': { $ref: '#/components/responses/CsrfProblem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
        '429': { $ref: '#/components/responses/RateLimitProblem' }
        '503': { $ref: '#/components/responses/IdentityUnavailableProblem' }
  /auth/logout:
    post:
      summary: Invalidate the current session and regenerate its CSRF token
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Session invalidated. }
        '401': { $ref: '#/components/responses/UnauthenticatedProblem' }
        '419': { $ref: '#/components/responses/CsrfProblem' }
        '429': { $ref: '#/components/responses/RateLimitProblem' }
        '503': { $ref: '#/components/responses/IdentityUnavailableProblem' }
  /me:
    get:
      summary: Read the authenticated caller's identity
      description: Private response with no-store. Never cached as catalog content.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Authorized identity.
          content: { application/json: { schema: { $ref: '#/components/schemas/IdentityResource' } } }
        '401': { $ref: '#/components/responses/UnauthenticatedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '429': { $ref: '#/components/responses/RateLimitProblem' }
        '503': { $ref: '#/components/responses/IdentityUnavailableProblem' }
  /health:
    servers:
      - url: /
    get:
      summary: Check application liveness
      description: Stateless probe. Does not start a session or require Redis, PostgreSQL or Marvel availability.
      responses:
        '200':
          description: The application can serve requests.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /ready:
    servers:
      - url: /
    get:
      summary: Check cache access and credential configuration
      description: Stateless probe of cache access and Marvel credential presence. Does not start a session, check PostgreSQL, call Marvel or validate the credentials with it.
      responses:
        '200':
          description: Cache is accessible and Marvel credentials are configured.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ready }
        '503':
          description: Cache is unavailable or Marvel credentials are missing.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: not_ready }
  /characters:
    get:
      summary: List catalog characters
      description: Public, non-personalized read. Does not initialize or inspect a session or issue session cookies.
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A paginated character collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterCollection'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
        '502':
          $ref: '#/components/responses/UpstreamProblem'
        '503':
          $ref: '#/components/responses/CatalogUnavailableProblem'
  /characters/{characterId}:
    get:
      summary: Get one character
      description: Public, non-personalized read. Does not initialize or inspect a session or issue session cookies.
      parameters:
        - $ref: '#/components/parameters/CharacterId'
      responses:
        '200':
          description: A character.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterResource'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '502':
          $ref: '#/components/responses/UpstreamProblem'
        '503':
          $ref: '#/components/responses/CatalogUnavailableProblem'
  /characters/{characterId}/stories:
    get:
      summary: List stories related to a character
      description: Public, non-personalized read. Does not initialize or inspect a session or issue session cookies.
      parameters:
        - $ref: '#/components/parameters/CharacterId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A paginated story collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryCollection'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
        '502':
          $ref: '#/components/responses/UpstreamProblem'
        '503':
          $ref: '#/components/responses/CatalogUnavailableProblem'
  /stories/{storyId}/comics:
    get:
      summary: List comics related to a story
      description: Public, non-personalized read. Does not initialize or inspect a session or issue session cookies.
      parameters:
        - $ref: '#/components/parameters/StoryId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A paginated comic collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComicCollection'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
        '502':
          $ref: '#/components/responses/UpstreamProblem'
        '503':
          $ref: '#/components/responses/CatalogUnavailableProblem'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: marvel_heroes_session
      description: HttpOnly first-party session cookie, Secure in production, SameSite=Lax. State-changing requests also send the CSRF cookie value in X-XSRF-TOKEN. No token issuance endpoint exists.
  parameters:
    SearchQuery:
      name: query
      in: query
      schema: { type: string, minLength: 2, maxLength: 100 }
      description: Case-insensitive character name prefix.
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, maximum: 9007199254740991, default: 1 }
      description: Positive safe integer. With per_page capped at 100, offset arithmetic stays within PHP 64-bit integers. Invalid pagination returns 422 before upstream dispatch.
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    CharacterId:
      name: characterId
      in: path
      required: true
      schema: { type: integer, minimum: 1, maximum: 9007199254740991 }
      description: Positive JavaScript-safe integer; invalid or oversized identifiers return 404 before upstream dispatch.
    StoryId:
      name: storyId
      in: path
      required: true
      schema: { type: integer, minimum: 1, maximum: 9007199254740991 }
      description: Positive JavaScript-safe integer; invalid or oversized identifiers return 404 before upstream dispatch.
  responses:
    UnauthenticatedProblem:
      description: A valid session is required.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ForbiddenProblem:
      description: The authenticated caller is not authorized for the identity.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    CsrfProblem:
      description: CSRF validation failed; bootstrap the session again before retrying manually.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ValidationProblem:
      description: Invalid request fields or query parameters.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    IdentityUnavailableProblem:
      description: Identity persistence or its required session/rate-limit store is unavailable. Redis failures use code dependency-unavailable and never bypass session or rate-limit checks.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    RateLimitProblem:
      description: Local rate limit exceeded.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFoundProblem:
      description: Catalog resource not found.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    UpstreamProblem:
      description: Marvel API could not be reached and no stale result is available.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    CatalogUnavailableProblem:
      description: The upstream budget is exhausted, refresh is in progress without stale data, or Redis is unavailable. Redis failures use code dependency-unavailable; the server never bypasses cache or budget to call Marvel.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Login:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 72, writeOnly: true, description: Maximum 72 UTF-8 bytes; null characters are rejected. }
    Registration:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 72, writeOnly: true, description: Maximum 72 UTF-8 bytes; null characters are rejected. }
        password_confirmation: { type: string, minLength: 12, maxLength: 72, writeOnly: true }
    Identity:
      type: object
      required: [id, name, email]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
    IdentityResource:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Identity' }
    Meta:
      type: object
      required: [page, per_page, total, cache]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        cache: { $ref: '#/components/schemas/CatalogCache' }
    CatalogCache:
      type: object
      required: [state]
      description: Server cache state at response creation. Fresh includes a successful upstream load; stale means fallback within the existing retention window. Browser caching can reuse this snapshot. This is not the publication or modification date of Marvel content.
      properties:
        state: { type: string, enum: [fresh, stale] }
    Character:
      type: object
      required: [id, name, description, modified_at, image_url]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: [string, 'null'] }
        modified_at: { type: [string, 'null'], format: date-time }
        image_url: { type: [string, 'null'], format: uri }
    Story:
      type: object
      required: [id, title, type, modified_at, counts]
      properties:
        id: { type: integer }
        title: { type: string }
        type: { type: [string, 'null'] }
        modified_at: { type: [string, 'null'], format: date-time }
        counts:
          type: object
          additionalProperties: { type: integer }
    Comic:
      type: object
      required: [id, title, description, format, modified_at, on_sale_at, digital_price, image_url]
      properties:
        id: { type: integer }
        digital_id: { type: [integer, 'null'] }
        title: { type: string }
        description: { type: [string, 'null'] }
        format: { type: [string, 'null'] }
        modified_at: { type: [string, 'null'], format: date-time }
        on_sale_at: { type: [string, 'null'], format: date-time }
        digital_price: { type: [number, 'null'] }
        image_url: { type: [string, 'null'], format: uri }
    CharacterResource:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Character' }
        meta:
          type: object
          required: [cache]
          properties:
            cache: { $ref: '#/components/schemas/CatalogCache' }
    CharacterCollection:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Character' } }
        meta: { $ref: '#/components/schemas/Meta' }
    StoryCollection:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Story' } }
        meta: { $ref: '#/components/schemas/Meta' }
    ComicCollection:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Comic' } }
        meta: { $ref: '#/components/schemas/Meta' }
    Problem:
      type: object
      required: [type, title, status, code, detail, request_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        request_id: { type: [string, 'null'] }
        errors:
          type: object
          description: Field validation issues, present only on validation failures.
          additionalProperties:
            type: array
            items: { type: string }
